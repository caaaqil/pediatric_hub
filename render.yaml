# Render blueprint — deploys the API and a free PostgreSQL database.
#
# In Render: New → Blueprint → connect this repo. Render reads this file,
# creates both services and links them. Then fill in the secrets marked
# `sync: false` in the dashboard (they are deliberately not stored in git).
#
# The build runs migrations and the seed on every deploy. Both are safe to
# repeat: `migrate deploy` only applies pending migrations, and seed.js upserts.

databases:
  - name: pediatric-hub-db
    plan: free
    databaseName: pediatric_hub
    user: pediatric_hub

services:
  - type: web
    name: pediatric-hub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node prisma/seed.js
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      # Wired automatically from the database above
      - key: DATABASE_URL
        fromDatabase:
          name: pediatric-hub-db
          property: connectionString

      - key: NODE_ENV
        value: production

      # Generated once by Render and kept secret
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d

      # Comma-separated origins allowed to open Socket.IO connections.
      # Set this to your deployed web client URL once it exists.
      - key: CLIENT_ORIGINS
        sync: false

      # Paste these in the Render dashboard — never committed
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: WAAFIPAY_URL
        value: https://api.waafipay.net/asm
      - key: WAAFIPAY_MERCHANT_UID
        sync: false
      - key: WAAFIPAY_API_USER_ID
        sync: false
      - key: WAAFIPAY_API_KEY
        sync: false
