name: pediatric_health_hub_mobile
description: "Pediatric Health Hub — Flutter mobile client for the Node/Express + Prisma backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Teleconsultation video calls. The backend's Socket.IO namespace in
  # `backend/src/server.js` relays the offer/answer/ICE exchange; these two
  # let the app join the same rooms the web client uses.
  flutter_webrtc: ^0.12.5
  socket_io_client: ^2.0.3+1

  # Routing
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Charts — mobile equivalent of the web app's Recharts area charts
  fl_chart: ^0.69.0

  # Formatting
  intl: ^0.19.0

  # Typeface used by the web app (Inter)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
